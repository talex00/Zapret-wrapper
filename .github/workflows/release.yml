# Сборка и публикация релиза.
#
# Два способа запуска:
#   1. пуш тега вида v0.1.0;
#   2. вручную: Actions -> Release -> Run workflow, ввести версию. Тег будет создан сам.
#
# В релиз кладём два артефакта:
#   * lite  — framework-dependent, пара мегабайт, нужен .NET 8 Desktop Runtime;
#   * full  — self-contained, ничего доставлять не надо.
#
# Почему full всё равно немаленький: вместе с программой едет весь WPF и CoreCLR.
# Тримминг (PublishTrimmed) для WPF не поддерживается — XAML грузит типы через
# рефлексию, и обрезанный билд падает в рантайме. Зато убран ReadyToRun (он давал
# десятки лишних мегабайт прекомпиляции) и включено сжатие внутри single-file.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Определить версию
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { "${{ github.ref_name }}" } else { "${{ github.event.inputs.version }}" }
          if (-not $version) { throw 'Не удалось определить версию релиза.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "number=$($version.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Сборка lite (требует .NET 8 Desktop Runtime)
        shell: pwsh
        run: |
          dotnet publish src/ZapretWrapper/ZapretWrapper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.number }} `
            -o publish-lite

      - name: Сборка full (self-contained)
        shell: pwsh
        run: |
          dotnet publish src/ZapretWrapper/ZapretWrapper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.number }} `
            -o publish-full

      - name: Упаковать
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path publish-lite/* -DestinationPath "ZapretWrapper-$tag-win-x64-lite.zip"
          Compress-Archive -Path publish-full/* -DestinationPath "ZapretWrapper-$tag-win-x64.zip"
          # Размеры видны в логе: удобно следить, чтобы билд не распухал между версиями.
          Get-ChildItem *.zip, publish-lite/*.exe, publish-full/*.exe |
            ForEach-Object { "{0,-52} {1,8:N1} МБ" -f $_.Name, ($_.Length / 1MB) }

      - name: Собрать описание релиза
        shell: pwsh
        run: |
          # Берём из CHANGELOG.md блок текущей версии: от её заголовка до следующего "## ".
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## ${{ steps.version.outputs.version }}" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          } else {
            $body = @('Подробности см. в CHANGELOG.md.')
          }
          $body += ''
          $body += '### Какой архив скачать'
          $body += ''
          $body += '* `...-win-x64-lite.zip` — лёгкий. Требует [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0/runtime) (x64).'
          $body += '* `...-win-x64.zip` — со встроенным .NET. Больше весит, зато ничего доставлять не нужно.'
          $body += ''
          $body += '### Установка'
          $body += ''
          $body += 'Распакуйте zip и запустите `ZapretWrapper.exe`.'
          $body += 'При первом запуске укажите в настройках папку zapret. Программа запросит права администратора: без них WinDivert не ставит фильтр.'
          $body | Set-Content -Path release-notes.md -Encoding utf8

      - name: Опубликовать релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $assets = @("ZapretWrapper-$tag-win-x64-lite.zip", "ZapretWrapper-$tag-win-x64.zip")
          if (gh release view $tag 2>$null) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag @assets --title "Zapret Wrapper $tag" --notes-file release-notes.md --target ${{ github.sha }}
          }
