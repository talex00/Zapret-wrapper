# Сборка и публикация релиза.
#
# Два способа запуска:
#   1. пуш тега вида v0.1.0;
#   2. вручную: Actions -> Release -> Run workflow, ввести версию. Тег будет создан сам.
#
# Собирается self-contained single-file exe: программа для людей, которые вряд ли
# будут ставить .NET Desktop Runtime руками. ReadyToRun включён ради быстрого старта.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Определить версию
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { "${{ github.ref_name }}" } else { "${{ github.event.inputs.version }}" }
          if (-not $version) { throw 'Не удалось определить версию релиза.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "number=$($version.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Сборка
        shell: pwsh
        run: |
          dotnet publish src/ZapretWrapper/ZapretWrapper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ steps.version.outputs.number }} `
            -o publish

      - name: Упаковать
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "ZapretWrapper-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Собрать описание релиза
        shell: pwsh
        run: |
          # Берём из CHANGELOG.md блок текущей версии: от её заголовка до следующего "## ".
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## ${{ steps.version.outputs.version }}" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          } else {
            $body = @('Подробности см. в CHANGELOG.md.')
          }
          $body += ''
          $body += '### Установка'
          $body += ''
          $body += 'Распакуйте zip и запустите `ZapretWrapper.exe`. .NET ставить не нужно.'
          $body += 'При первом запуске укажите в настройках папку zapret. Программа запросит права администратора: без них WinDivert не ставит фильтр.'
          $body | Set-Content -Path release-notes.md -Encoding utf8

      - name: Опубликовать релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $zip = "ZapretWrapper-$tag-win-x64.zip"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag $zip --title "Zapret Wrapper $tag" --notes-file release-notes.md --target ${{ github.sha }}
          }
